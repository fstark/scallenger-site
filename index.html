:root {
    --navy: #15304a;
    --cream: #f6f0e1;
    --paper: #fbf8f0;
    --sky: #8fd3ea;
    --sky2: #b9e4f2;
    --red: #d6453b;
    --p0: #0072b2;
    --p1: #e69f00;
    --p2: #cc79a7;
    --p3: #009e73;
    --muted: #15304a99;
    --line: #15304a30;
    --display: "Pathway Gothic One", sans-serif;
    --safe-top: env(safe-area-inset-top, 0px);
}

* { box-sizing: border-box; }

html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    font-family: "Nunito Sans", sans-serif;
    color: var(--navy);
    background: var(--paper);
    -webkit-tap-highlight-color: transparent;
}

#app {
    max-width: 480px;
    height: 100dvh;
    margin: 0 auto;
    background: var(--paper);
}

.screen {
    display: flex;
    flex-direction: column;
    height: 100%;
    padding: 16px;
    gap: 12px;
}
.screen[hidden] { display: none; }

button {
    font: inherit;
    padding: 12px;
    border: 2px solid var(--navy);
    border-radius: 0;
    background: var(--cream);
    color: var(--navy);
    cursor: pointer;
}
button:disabled { opacity: .4; cursor: default; }
button.cta { font-weight: 600; box-shadow: 3px 3px 0 var(--navy); }
button[hidden] { display: none; }
:focus-visible { outline: 2px solid var(--navy); outline-offset: 2px; }

h1, h2, h3 { margin: 0; font-weight: 500; }
.hint { color: var(--muted); }
h3 { font-size: 1rem; }

.back { padding: 0; border: none; background: none; color: inherit; line-height: 1; }

/* Section title between two diamonds (◆ is not in the font subsets). */
.title {
    font-family: var(--display);
    font-weight: 400;
    font-size: 20px;
    letter-spacing: 5px;
    text-align: center;
}
.title::before, .title::after {
    content: "";
    display: inline-block;
    width: 4px;
    height: 4px;
    margin: 0 12px;
    vertical-align: 6px;
    background: currentColor;
    transform: rotate(45deg);
}

/* Themes */
#screen-themes {
    position: relative;
    padding: 0;
    gap: 0;
    background: repeating-conic-gradient(from -90deg at 50% 108%, var(--sky2) 0 6deg, var(--sky) 6deg 12deg);
}
.masthead {
    padding: calc(var(--safe-top) + 2px) 0 18px;
    text-align: center;
    background: var(--cream);
    border-bottom: 3px solid var(--navy);
    box-shadow: 0 3px 0 var(--cream), 0 6px 0 var(--navy);
}
.masthead h1 {
    font-family: var(--display);
    font-weight: 400;
    font-size: 76px;
    line-height: .9;
    letter-spacing: 5px;
    color: var(--red);
    -webkit-text-stroke: 1.5px var(--red);
    text-shadow: 3px 3px 0 var(--navy);
}
.tagline { margin: 6px 0 0; font-size: 12px; letter-spacing: 4px; text-transform: uppercase; }
#screen-themes .title { margin: 30px 0 18px; }
#theme-list { display: flex; flex-direction: column; gap: 16px; padding: 0 22px; }
#theme-list button {
    position: relative;
    display: flex;
    align-items: center;
    height: 66px;
    padding: 0;
    border: none;
    background: none;
}
.medallion {
    position: relative;
    z-index: 1;
    display: grid;
    place-items: center;
    width: 66px;
    height: 66px;
    border-radius: 50%;
    background: var(--navy);
    color: var(--cream);
    box-shadow: 0 0 0 3px var(--cream);
}
.medallion svg { width: 36px; height: 36px; fill: currentColor; }
#theme-list .ribbon {
    position: absolute;
    left: 40px;
    right: 0;
    height: 46px;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding: 2px 30px 0 0;
    background: var(--cream);
    font-family: var(--display);
    font-size: 32px;
    letter-spacing: 2px;
    clip-path: polygon(0 0, 100% 0, calc(100% - 16px) 100%, 0 100%);
    animation: draw-in 250ms ease-out backwards;
}
#theme-list .ribbon::after {
    content: "";
    position: absolute;
    left: 0;
    right: 16px;
    bottom: 5px;
    border-bottom: 1.5px solid var(--navy);
    opacity: .35;
}
#theme-list button:nth-child(2) .ribbon { animation-delay: 60ms; }
#theme-list button:nth-child(3) .ribbon { animation-delay: 120ms; }
#theme-list button:nth-child(4) .ribbon { animation-delay: 180ms; }
#theme-list button:nth-child(5) .ribbon { animation-delay: 240ms; }
#theme-list button:nth-child(6) .ribbon { animation-delay: 300ms; }
@keyframes draw-in {
    from { clip-path: polygon(0 0, 0 0, 0 100%, 0 100%); }
}
.credits {
    position: absolute;
    bottom: 18px;
    width: 100%;
    text-align: center;
    font-size: 11px;
    letter-spacing: 2px;
    opacity: .7;
}

/* Game start */
#screen-start { padding: 0; gap: 0; }
.hero {
    position: relative;
    padding: calc(var(--safe-top) + 4px) 0 22px;
    text-align: center;
    background: repeating-conic-gradient(from -90deg at 50% 120%, var(--sky2) 0 6deg, var(--sky) 6deg 12deg);
    border-bottom: 3px solid var(--navy);
    box-shadow: 0 3px 0 var(--cream), 0 6px 0 var(--navy);
}
.hero .back {
    position: absolute;
    left: 14px;
    top: calc(var(--safe-top) - 4px);
    font-size: 34px;
}
#start-icon { z-index: auto; width: 86px; height: 86px; margin: 0 auto; }
#start-icon svg { width: 48px; height: 48px; }
#start-theme {
    display: inline-block;
    position: relative;
    margin-top: -10px;
    padding: 6px 42px 0;
    background: var(--cream);
    font-size: 36px;
    letter-spacing: 2px;
}
#start-available { margin: 8px 0 0; font-size: 13px; font-weight: 600; }
#screen-start .title { margin: 30px 0 14px; letter-spacing: 2px; }
#card-counts { display: flex; gap: 8px; padding: 0 24px; }
#card-counts button {
    flex: 1;
    height: 44px;
    padding: 0;
    font-family: var(--display);
    font-size: 28px;
    letter-spacing: 2px;
    transform: skewX(-12deg);
}
#card-counts span { display: inline-block; transform: skewX(12deg); }
#card-counts button[aria-pressed="true"] { background: var(--navy); color: var(--cream); }
#card-counts button:disabled { opacity: 1; }
#player-list { display: flex; justify-content: space-around; padding: 0 20px; }
.player { position: relative; text-align: center; font-size: 12px; font-weight: 700; letter-spacing: 1px; cursor: pointer; }
.player input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.player .disc {
    display: grid;
    place-items: center;
    width: 58px;
    height: 58px;
    margin: 0 auto 8px;
    border-radius: 50%;
    font-family: var(--display);
    font-size: 26px;
}
.player.on .disc { box-shadow: 0 0 0 3px var(--paper), 0 0 0 6px var(--c); }
.player.off .disc { background: var(--cream); border: 2px dashed var(--c); color: var(--c); }
.player.off { opacity: .6; }
.player input:focus-visible + .disc { outline: 2px solid var(--navy); outline-offset: 8px; }
.locked .player, .locked #card-counts button { cursor: default; }
/* ✓ is not in the font subsets. */
.check {
    width: 10px;
    height: 20px;
    border: solid var(--navy);
    border-width: 0 4px 4px 0;
    transform: translateY(-2px) rotate(40deg);
}
.actions { display: flex; flex-direction: column; margin: auto 24px 0; }
.actions .link { margin-top: 18px; }
.summary { margin: 14px 0 30px; text-align: center; font-size: 12px; opacity: .6; }

/* Shared shapes */
.pennant {
    --point: 14px;
    font-family: var(--display);
    font-weight: 400;
    clip-path: polygon(var(--point) 0, calc(100% - var(--point)) 0, 100% 50%,
        calc(100% - var(--point)) 100%, var(--point) 100%, 0 50%);
}
.block {
    display: block;
    width: 100%;
    height: 64px;
    padding: 0;
    border: none;
    background: var(--navy);
    color: var(--cream);
    font-family: var(--display);
    font-size: 40px;
    line-height: 64px;
    letter-spacing: 6px;
    box-shadow: inset 0 0 0 4px var(--navy), inset 0 0 0 5.5px var(--cream);
}
.block:disabled { opacity: .6; }
.link {
    padding: 0;
    border: none;
    background: none;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 2px;
    text-decoration: underline;
    text-underline-offset: 4px;
    opacity: .7;
}
.rayed, #scores .score.rayed { background: repeating-conic-gradient(var(--c) 0 10deg, color-mix(in srgb, var(--c) 80%, white) 10deg 20deg); }
.scallops {
    background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='20'><defs><g id='f'><circle r='19.3' fill='%23fbf8f0'/><circle r='13.3' fill='none'/><circle r='7.3' fill='none'/></g></defs><g stroke='%2315304a' stroke-opacity='.13' stroke-width='1.2'><use href='%23f' x='0' y='0'/><use href='%23f' x='40' y='0'/><use href='%23f' x='20' y='10'/><use href='%23f' x='0' y='20'/><use href='%23f' x='40' y='20'/></g></svg>") 0 0 / 40px 20px, var(--paper);
}

/* Colors */
.color-0 { --c: var(--p0); }
.color-1 { --c: var(--p1); }
.color-2 { --c: var(--p2); }
.color-3 { --c: var(--p3); }

/* Main game */
#screen-game { padding: 0; gap: 0; }
.game-top {
    background: var(--navy);
    color: var(--cream);
    border-bottom: 3px solid var(--navy);
    box-shadow: 0 3px 0 var(--cream), 0 6px 0 var(--navy);
    position: relative;
    z-index: 1;
}
.game-bar { display: flex; align-items: center; gap: 10px; padding: var(--safe-top) 14px 10px; }
.game-bar .back { width: 22px; font-size: 30px; }
#game-icon svg { display: block; width: 22px; height: 22px; fill: var(--sky); }
#game-theme { flex: 1; padding-top: 4px; font-family: var(--display); font-weight: 400; font-size: 24px; letter-spacing: 3px; }
#game-round { font-size: 13px; opacity: .8; }
#progress { display: flex; gap: 5px; padding: 0 14px 10px; }
#progress span { flex: 1; height: 5px; background: #ffffff30; transform: skewX(-30deg); }
#progress span.done { background: var(--sky); }
#scores { display: flex; justify-content: space-around; align-items: center; padding: 8px 16px 16px; }
#scores .score {
    display: grid;
    place-items: center;
    width: 56px;
    height: 56px;
    padding-top: 2px;
    border-radius: 50%;
    background: var(--cream);
    color: var(--navy);
    box-shadow: 0 0 0 4px var(--c);
    font-family: var(--display);
    font-size: 38px;
    line-height: 1;
    letter-spacing: 1.5px;
}
#scores .score.current { transform: scale(1.15); box-shadow: 0 0 0 3px var(--cream), 0 0 0 6px var(--c); }
#scores .score.played { filter: saturate(.45); opacity: .82; }

#play-area { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }

/* Cards: owner's colour mixed 14% into cream, tone-on-tone scallops. */
.card {
    position: relative;
    padding: 18px 12px 10px;
    border: 6px double var(--navy);
    background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='20'><defs><g id='f'><circle r='19.3' fill='%23f6f0e1'/><circle r='13.3' fill='none'/><circle r='7.3' fill='none'/></g></defs><g stroke='%2315304a' stroke-opacity='.13' stroke-width='1.2'><use href='%23f' x='0' y='0'/><use href='%23f' x='40' y='0'/><use href='%23f' x='20' y='10'/><use href='%23f' x='0' y='20'/><use href='%23f' x='40' y='20'/></g></svg>") 0 0 / 40px 20px, var(--cream);
}
.card.color-0 { background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='20'><defs><g id='f'><circle r='19.3' fill='%23d4deda'/><circle r='13.3' fill='none'/><circle r='7.3' fill='none'/></g></defs><g stroke='%230072b2' stroke-opacity='.25' stroke-width='1.2'><use href='%23f' x='0' y='0'/><use href='%23f' x='40' y='0'/><use href='%23f' x='20' y='10'/><use href='%23f' x='0' y='20'/><use href='%23f' x='40' y='20'/></g></svg>") 0 0 / 40px 20px, #d4deda; }
.card.color-1 { background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='20'><defs><g id='f'><circle r='19.3' fill='%23f4e5c2'/><circle r='13.3' fill='none'/><circle r='7.3' fill='none'/></g></defs><g stroke='%23e69f00' stroke-opacity='.35' stroke-width='1.2'><use href='%23f' x='0' y='0'/><use href='%23f' x='40' y='0'/><use href='%23f' x='20' y='10'/><use href='%23f' x='0' y='20'/><use href='%23f' x='40' y='20'/></g></svg>") 0 0 / 40px 20px, #f4e5c2; }
.card.color-2 { background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='20'><defs><g id='f'><circle r='19.3' fill='%23f0dfd9'/><circle r='13.3' fill='none'/><circle r='7.3' fill='none'/></g></defs><g stroke='%23cc79a7' stroke-opacity='.3' stroke-width='1.2'><use href='%23f' x='0' y='0'/><use href='%23f' x='40' y='0'/><use href='%23f' x='20' y='10'/><use href='%23f' x='0' y='20'/><use href='%23f' x='40' y='20'/></g></svg>") 0 0 / 40px 20px, #f0dfd9; }
.card.color-3 { background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='20'><defs><g id='f'><circle r='19.3' fill='%23d4e4d2'/><circle r='13.3' fill='none'/><circle r='7.3' fill='none'/></g></defs><g stroke='%23009e73' stroke-opacity='.35' stroke-width='1.2'><use href='%23f' x='0' y='0'/><use href='%23f' x='40' y='0'/><use href='%23f' x='20' y='10'/><use href='%23f' x='0' y='20'/><use href='%23f' x='40' y='20'/></g></svg>") 0 0 / 40px 20px, #d4e4d2; }
.card .label {
    --point: 10px;
    position: absolute;
    top: -14px;
    left: 50%;
    transform: translateX(-50%);
    padding: 4px 20px 1px;
    white-space: nowrap;
    background: var(--navy);
    color: var(--cream);
    font-size: 12px;
    letter-spacing: 3px;
}
.card[class*="color-"] .label { background: var(--c); color: var(--navy); }
.card .text { font-size: 16px; line-height: 1.35; font-weight: 500; }
.card.result { display: flex; align-items: center; gap: 12px; }
.card.result .year { flex: none; padding-top: 4px; font-family: var(--display); font-size: 40px; line-height: 1; letter-spacing: 1.5px; }
.card.result .year.long { font-size: 28px; }
.card.result .text { font-size: 14px; }
#card-zone .card { margin: 26px 14px 8px; cursor: pointer; }

/* Covers the play area so any tap docks the card; the result card stays above it. */
#card-front {
    position: absolute;
    inset: 0;
    z-index: 2;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 16px;
    padding: 0 18px 18%;
    background: #fbf8f0e0;
    cursor: pointer;
}
#card-front[hidden] { display: none; }
#card-front .card { margin-top: 26px; padding: 26px 16px 18px; box-shadow: 0 14px 30px -12px #15304a80; }
#card-front .card::before {
    content: "";
    position: absolute;
    z-index: -1;
    left: 50%;
    top: 50%;
    width: 1200px;
    height: 1200px;
    transform: translate(-50%, -50%);
    background: repeating-conic-gradient(color-mix(in srgb, var(--c, #15304a80) 30%, transparent) 0 10deg, transparent 10deg 20deg);
    -webkit-mask: radial-gradient(circle, #000 0 18%, transparent 45%);
    mask: radial-gradient(circle, #000 0 18%, transparent 45%);
    pointer-events: none;
}
#card-front .card .label { top: -16px; padding: 5px 24px 1px; font-size: 15px; }
#card-front .card .text { font-size: 22px; line-height: 1.35; }
#card-front .hint {
    --point: 10px;
    align-self: center;
    margin: 0;
    padding: 4px 22px 1px;
    background: var(--navy);
    color: var(--cream);
    font-size: 15px;
    letter-spacing: 3px;
}
#card-zone { position: relative; z-index: 3; }

#screen-game.busy { pointer-events: none; }

#board-zone { position: relative; isolation: isolate; flex: 1; min-height: 0; overflow: hidden; }
/* Faint rays centred on the marker (10px inset + 31px radius). */
#board-zone::before {
    content: "";
    position: absolute;
    right: -659px;
    top: 50%;
    width: 1400px;
    height: 1400px;
    transform: translateY(-50%);
    background: repeating-conic-gradient(#15304a09 0 10deg, transparent 10deg 20deg);
    -webkit-mask: radial-gradient(circle, #000 0 4%, #0008 20%, transparent 40%);
    mask: radial-gradient(circle, #000 0 4%, #0008 20%, transparent 40%);
    pointer-events: none;
}
#board-zone::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 1;
    background: linear-gradient(var(--paper), transparent 60px, transparent calc(100% - 60px), var(--paper));
    pointer-events: none;
}
#board {
    position: absolute;
    inset: 0;
    overflow-y: auto;
    scroll-snap-type: y mandatory;
    overscroll-behavior: contain;
}
#board .spacer {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    height: 50%;
    color: #15304a66;
    font-family: var(--display);
    font-size: 15px;
    letter-spacing: 3px;
}
/* ↑ and ↓ are not in the fonts. */
#board .spacer::before, #board .spacer::after {
    content: "";
    width: 8px;
    height: 6px;
    background: currentColor;
    clip-path: polygon(50% 0, 100% 100%, 0 100%);
}
#board .spacer::after { clip-path: polygon(0 0, 100% 0, 50% 100%); }
#board .gap { height: 0; scroll-snap-align: center; }
#board .row {
    display: flex;
    align-items: center;
    gap: 12px;
    height: 58px;
    padding: 0 70px 0 14px;
    border-bottom: 1px dashed var(--line);
}
#board .row.this-round { background: color-mix(in srgb, var(--c) 14%, transparent); box-shadow: inset 6px 0 var(--c); }
#board .row.this-round .year { color: var(--c); }
#board.animating { overflow: hidden; scroll-snap-type: none; }
/* The card being placed marks the spot itself. */
#board.animating ~ .marker-line { visibility: hidden; }
.chip {
    display: grid;
    place-items: center;
    width: 28px;
    height: 28px;
    padding-top: 1px;
    border-radius: 50%;
    background: var(--c);
    color: var(--navy);
    box-shadow: 0 0 0 2px var(--navy);
    font-family: var(--display);
    font-size: 18px;
}
.flying { position: fixed; z-index: 10; margin: 0; pointer-events: none; }
#board .row .year {
    flex: none;
    min-width: 58px;
    padding-top: 2px;
    text-align: right;
    white-space: nowrap;
    font-family: var(--display);
    font-size: 34px;
    line-height: 1;
    letter-spacing: 1.5px;
}
#board .row .year.long { font-size: 24px; letter-spacing: .5px; }
#board .row .text {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    font-size: 13.5px;
    line-height: 1.3;
}

/* Insertion line: double bar on the row boundary at the centre of the board. */
.marker-line {
    position: absolute;
    z-index: 2;
    left: 0;
    right: 0;
    top: 50%;
    height: 8px;
    transform: translateY(-50%);
    border-top: 2px solid var(--navy);
    border-bottom: 2px solid var(--navy);
    pointer-events: none;
}
#marker {
    position: absolute;
    z-index: 3;
    right: 10px;
    top: 50%;
    width: 62px;
    height: 62px;
    transform: translateY(-50%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1px 0 0;
    border-radius: 50%;
    border: 3px solid var(--navy);
    box-shadow: 0 0 0 3px var(--paper), 0 0 0 5px var(--navy);
    font-family: var(--display);
    font-size: 32px;
    letter-spacing: 1.5px;
}
#marker::before { content: "+"; }
#marker:disabled { opacity: 1; background: var(--cream); color: var(--muted); }
#marker.pulse { animation: pulse 1.2s ease-out infinite; }
@keyframes pulse {
    from { box-shadow: 0 0 0 3px var(--paper), 0 0 0 5px var(--navy), 0 0 0 5px #15304a80; }
    to { box-shadow: 0 0 0 3px var(--paper), 0 0 0 5px var(--navy), 0 0 0 19px #15304a00; }
}

#coach { position: absolute; inset: 0; z-index: 4; pointer-events: none; }
#coach[hidden] { display: none; }
#coach span {
    --point: 10px;
    position: absolute;
    padding: 4px 18px 1px;
    white-space: nowrap;
    background: var(--navy);
    color: var(--cream);
    font-size: 14px;
    letter-spacing: 2px;
}
.coach-slot { left: 14px; top: 50%; transform: translateY(-50%); }
.coach-points { right: 6px; bottom: calc(50% + 44px); }
.coach-press { right: 6px; top: calc(50% + 44px); }

/* Scores */
#screen-scores { padding: 0; gap: 0; isolation: isolate; }
.scores-top {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding-top: calc(var(--safe-top) + 6px);
    font-family: var(--display);
    font-size: 18px;
    letter-spacing: 4px;
}
#scores-icon svg { display: block; width: 20px; height: 20px; fill: var(--navy); }
.podium { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 300px; }
#winners { position: relative; display: flex; gap: 24px; }
/* Rays reaching the top of the screen, in the winner's colour (navy for a tie). */
#winners::before {
    content: "";
    position: absolute;
    z-index: -1;
    left: 50%;
    top: 50%;
    width: 900px;
    height: 900px;
    transform: translate(-50%, -50%);
    background: repeating-conic-gradient(color-mix(in srgb, var(--c, #15304a80) 45%, transparent) 0 10deg, transparent 10deg 20deg);
    -webkit-mask: radial-gradient(circle, #000 0 10%, transparent 30%);
    mask: radial-gradient(circle, #000 0 10%, transparent 30%);
    pointer-events: none;
}
#winners .big {
    display: grid;
    place-items: center;
    width: 124px;
    height: 124px;
    padding-top: 4px;
    border-radius: 50%;
    font-family: var(--display);
    font-size: 64px;
    letter-spacing: 2px;
    box-shadow: 0 0 0 4px var(--paper), 0 0 0 8px var(--c), 0 0 0 11px var(--paper), 0 0 0 13px var(--navy);
}
#winners.tie { gap: 36px; }
#winners.tie .big { width: 86px; height: 86px; font-size: 44px; }
#winners.tie-4 { gap: 30px; }
#winners.tie-4 .big { width: 58px; height: 58px; font-size: 32px; }
#winner {
    margin: 22px 0 0;
    padding: 6px 34px 0;
    background: var(--navy);
    color: var(--cream);
    font-size: 30px;
    letter-spacing: 4px;
}
#winner[class*="color-"] { background: var(--c); color: var(--navy); }
.rule { margin: 0 20px 24px; border-top: 3px solid var(--navy); box-shadow: 0 3px 0 var(--paper), 0 6px 0 var(--navy); }
#score-table { margin: 0 22px; border-collapse: collapse; }
#score-table th { padding: 0 0 8px; font-family: var(--display); font-weight: 400; font-size: 14px; letter-spacing: 2px; opacity: .65; }
#score-table td { padding: 8px 0; text-align: center; border-top: 1px dashed #15304a40; font-size: 15px; font-weight: 600; }
#score-table .rank { width: 30px; font-family: var(--display); font-weight: 400; font-size: 22px; opacity: .6; }
#score-table .who { width: 130px; padding-left: 10px; text-align: left; }
#score-table .med {
    display: inline-grid;
    place-items: center;
    width: 44px;
    height: 44px;
    padding-top: 2px;
    vertical-align: middle;
    border-radius: 50%;
    background: var(--cream);
    box-shadow: 0 0 0 3px var(--c);
    font-family: var(--display);
    font-weight: 400;
    font-size: 24px;
    letter-spacing: 2px;
}
#score-table .name { margin-left: 8px; vertical-align: middle; font-size: 12px; font-weight: 700; letter-spacing: 1px; }
#screen-scores .actions { margin: auto 24px 40px; }
#btn-ok { height: 60px; font-size: 36px; line-height: 60px; }
</style>

<main id="app">

    <section id="screen-themes" class="screen" hidden>

ochats' est le premier long métrage d’animation de la compagnie Disney à paraître après la mort de Walt Disney"],[1971,"Le nouvel album du groupe de rock anglais Rolling Stones 'Sticky Fingers' fait scandale à cause de sa pochette 'braguette' créée par Andy Warhol"],[1971,"Le chanteur du groupe 'The Doors', James Douglas Morrison dit Jim Morrison, meurt à Paris dans son bain à 28 ans"],[1971,"Sortie du film d'arts martiaux 'The Big Boss' à Hong Kong avec Bruce Lee qui devient alors une véritable star"],[1971,"Adapté du roman d'Anthony Burgess le neuvième film de Stanley Kubrick 'Orange Mécanique' est projeté pour la première fois à New-York"],[1971,"La sortie du film 'Chiens de Paille' de Sam Peckinpah crée un scandale pour son ultra-violence"],[1973,"L'artiste espagnol  peintre, sculpteur, graveur et céramiste Pablo Picasso meurt à 91 ans dans sa propriété de Mougins dans les Alpes-Maritimes"],[1973,"Le film 'La Grande Bouffe' du réalisateur italien Marco Ferreri, avec Mastroianni, Noiret, Piccoli et Tognazzi, fait scandale au Festival de Cannes"],[1973,"Guy Lux créé la première émission télévisée interactive, en appelant SVP 11-11: 'La Une est à vous'"],[1973,"Marlon Brando refuse l'Oscar d'interprétation pour son rôle du 'Parrain' de Coppola à cause du traitement réservé aux indiens dans les films"],[1973,"Le comique français Fernand Reynaud se tue dans un accident de voiture à 47 ans. Il laisse de nombreux sketch tel le '22 à Asnières'"],[1974,"La première édition du Festival de la bande dessiné d’Angoulême ouvre ses portes avec notamment comme invités Hugo Pratt et André Franquin"],[1974,"Coluche avec sa salopette et son t-shirt jaune, crée son premier one man show: 'Mes adieux au Music Hall' avec le sketch 'C'est l'histoire d'un mec"],[1975,"Gotlib et Diament sortent le premier volume du magazine Fluide Glacial qui propose des bandes dessinées humoristiques pour adultes"],[1975,"L'écrivain, poète et cinéaste italien Pier Paolo Pasolini est assassiné à 53 ans à re"],[1782,"La montgolfière, aérostat, ballon à air chaud, est inventé par les frères papetiers français Joseph et Étienne de Montgolfier"],[1783,"Le gaz d'éclairage est inventé par le professeur d'université limbourgeois Jan Pieter Minckeleers afin d'éclairer son atelier"],[1783,"C'est le physicien français Louis-Sébastien Lenormand qui expérimente pour la première fois un parachute avec de petits animaux"],[1783,"L'horloger et orfèvre suisse Johann Jacob Schweppe dépose un brevet de gazeïfication de l'eau, destiné alors principalement à un usage médical"],[1784,"La batteuse, machine agricole servant à battre les céréales pour séparer le grain de la paille et de la balle, est inventé par l'ingénieur écossais Andrew Meikle"],[1785,"Le pasteur et mécanicien anglais Edmund Cartwright invente le métier à tisser mécanique"],[1791,"Marie Harel, habitante de Camembert en France invente le fromage du même nom après qu'un prête lui ait révélé le secret de la fabrication du Brie"],[1791,"Un chimiste français élabore pour la première fois le bicarbonate de sodium utilisé comme agent nettoyant, adouciseur d'eau, soin du corps..."],[1794,"Le chimiste français Nicolas-Jacques Conté invente le crayon, constitué d'une mine de graphite et d'argile insérée dans un corps en bois de cèdre"],[1795,"Le premier brevet d'invention d'un tire bouchon, dont l'ancêtre est la vrille à tonneau, est déposé par le révérend anglais Samuel Henshall"],[1795,"Le mécanicien et inventeur anglais Joseph Bramah invente le joint d'étanchéïté, en cuir embouti, en mettant au point la première presse hydraulique"],[1795,"L'inventeur français Nicolas Appert met au point un procédé qui rend possible la mise en conserve des aliments par stérilisation appelé alors 'appertisation'"],[1795,"La mesure de longueur officielle adoptée par la France est le mètre"],[1796,"L'allemand Aloys Senefelder invente la lithographie: technique d’impression permettant la reproduction d’un tracé exécuté à l’encre sur une pierre cal <script>
"use strict";

// Game logic only (no DOM). State is a plain object so it can be saved as JSON.
const Scallenger = (() => {
    const COLORS = ["Bleu", "Orange", "Rose", "Vert"];
    const SYSTEM_PLAYER = -1;

    function shuffle(items) {
        for (let i = items.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [items[i], items[j]] = [items[j], items[i]];
        }
        return items;
    }

    function availablePoints(cardsPlayed) {
        return Math.floor(cardsPlayed / 6) + 1;
    }

    // facts: array of [year, text]; players: color indices
    function newGame(theme, facts, cardCount, players) {
        const deck = shuffle(facts.map(([year, text]) => ({ year, text }))).slice(0, cardCount + 2);
        const board = deck.splice(0, 2)
            .map(f => ({ ...f, player: SYSTEM_PLAYER, round: -1, points: 0, max: 0 }))
            .sort((a, b) => b.year - a.year);
        return {
            theme,
            cardCount,
            players: [...players].sort((a, b) => a - b),
            board,
            deck,
            turn: 0,
            round: 0,
            available: availablePoints(0),
            last: null,
            over: false,
        };
    }

    const currentPlayer = s => s.players[s.turn % s.players.length];
    const currentCard = s => s.deck[0];
    const totalRounds = s => s.cardCount / s.players.length;

    // Moves a card from the chosen gap to its correct gap. A group of identical dates is one move;
    // a group made only of cards placed this round is free. Steps list each group jumped, in order.
    function locate(board, year, gap, round) {
        let index = gap;
        let moves = 0;
        const steps = [];
        while (index > 0 && board[index - 1].year < year) {
            const y = board[index - 1].year;
            const start = index;
            let counts = false;
            while (index > 0 && board[index - 1].year === y) {
                if (board[index - 1].round !== round) counts = true;
                index--;
            }
            if (counts) moves++;
            steps.push({ count: start - index, cost: counts });
        }
        while (index < board.length && board[index].year > year) {
            const y = board[index].year;
            const start = index;
            let counts = false;
            while (index < board.length && board[index].year === y) {
                if (board[index].round !== round) counts = true;
                index++;
            }
            if (counts) moves++;
            steps.push({ count: index - start, cost: counts });
        }
        return { index, moves, steps };
    }

    function play(s, gap) {
        const card = currentCard(s);
        const player = currentPlayer(s);
        const { index, moves, steps } = locate(s.board, card.year, gap, s.round);
        const points = Math.max(0, s.available - moves);
        s.board.splice(index, 0, { ...card, player, round: s.round, points, max: s.available });
        s.deck.shift();
        s.last = { index, player };
        return { index, steps };
    }

    // s.last is kept so the next card can show the previous result.
    function next(s) {
        s.turn++;
        if (s.turn >= s.cardCount) {
            s.over = true;
            s.round++;
        } else if (s.turn % s.players.length === 0) {
            s.round++;
            s.available = availablePoints(s.turn);
        }
    }

    function outcome(card) {
        if (card.points === card.max) return "perfect";
        return card.points > 0 ? "imperfect" : "failed";
    }

    function scores(s) {
        const res = {};
        for (const p of s.players) {
            res[p] = { total: 0, inRound: 0, played: false, perfect: 0, imperfect: 0, failed: 0 };
        }
        for (const c of s.board) {
            const r = res[c.player];
            if (!r) continue;
            if (c.round === s.round) {
                r.inRound += c.points;
                r.played = true;
            } else {
                r.total += c.points;
            }
            r[outcome(c)]++;
        }
        return res;
    }

    // Sorted by total, perfect, imperfect; equal rows share the same rank.
    function ranking(s) {
        const sc = scores(s);
        const rows = s.players.map(p => ({ player: p, ...sc[p], total: sc[p].total + sc[p].inRound }));
        rows.sort((a, b) => b.total - a.total || b.perfect - a.perfect || b.imperfect - a.imperfect);
        rows.forEach((r, i) => {
            const prev = rows[i - 1];
            r.rank = prev && prev.total === r.total && prev.perfect === r.perfect && prev.imperfect === r.imperfect
                ? prev.rank : i;
        });
        return rows;
    }

    return {
        COLORS, availablePoints, newGame, currentPlayer, currentCard,
        totalRounds, locate, play, next, outcome, scores, ranking,
    };
})();

if (typeof module !== "undefined") module.exports = Scallenger;
</script>
<script>
"use strict";

(() => {
    const S = Scallenger;
    const FACTS = window.SC_FACTS;
    const STORAGE_KEY = "scallenger.game";
    const CARD_COUNTS = [12, 24, 36, 48];
    const HOP_MS = 500;
    const RUSH_MS = 700;
    const POINT_STAGGER_MS = 80;
    const SETTLE_MS = 150;
    const SCROLL_THRESHOLD_PX = 10;
    const THEME_LABELS = { CINEMA: "CINÉMA" };
    const themeLabel = theme => THEME_LABELS[theme] ?? theme;

    const $ = id => document.getElementById(id);
    const el = (tag, props = {}, ...children) => {
        const e = Object.assign(document.createElement(tag), props);
        e.append(...children);
        return e;
    };
    const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
    const icon = theme => {
        const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        const use = document.createElementNS("http://www.w3.org/2000/svg", "use");
        use.setAttribute("href", `#${theme.toLowerCase()}`);
        svg.setAttribute("aria-hidden", "true");
        svg.append(use);
        return svg;
    };

    let game = load();
    const setup = { theme: null, cardCount: 24, players: [0] };
    let cardOpen = true;
    // The previous result stays in the docked zone until the next card is first docked.
    let showResult = true;
    // Whether the player has scrolled the board this turn, and where the turn started.
    let scrolled = false;
    let restTop = 0;
    let restGap = 0;
    let settleTimer = 0;

    function load() {
        try {
            const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
            return saved && saved.theme in FACTS ? saved : null;
        } catch {
            return null;
        }
    }

    function save() {
        if (game) localStorage.setItem(STORAGE_KEY, JSON.stringify(game));
        else localStorage.removeItem(STORAGE_KEY);
    }

    function show(name) {
        for (const s of document.querySelectorAll(".screen")) s.hidden = s.id !== `screen-${name}`;
        render[name]?.();
    }

    const render = {
        themes() {
            $("theme-list").replaceChildren(...Object.keys(FACTS).map(theme =>
                el("button", { onclick: () => { setup.theme = theme; show("start"); } },
                    el("span", { className: "medallion" }, icon(theme)),
                    el("span", { className: "ribbon", textContent: themeLabel(theme) }))));
        },

        start() {
            const locked = !!game;
            const cfg = game ?? setup;
            $("screen-start").classList.toggle("locked", locked);
            $("start-icon").replaceChildren(icon(cfg.theme));
            $("start-theme").textContent = themeLabel(cfg.theme);
            $("start-available").textContent = `${FACTS[cfg.theme].length.toLocaleString("fr-FR")} cartes disponibles`;

            $("card-counts").replaceChildren(...CARD_COUNTS.map(n => {
                const b = el("button", {
                    disabled: locked,
                    onclick: () => { setup.cardCount = n; render.start(); },
                }, el("span", { textContent: n }));
                b.setAttribute("aria-pressed", n === cfg.cardCount);
                return b;
            }));

            $("player-list").replaceChildren(...S.COLORS.map((color, p) => {
                const on = cfg.players.includes(p);
                const input = el("input", {
                    type: "checkbox",
                    checked: on,
                    disabled: locked,
                    onchange: () => {
                        setup.players = input.checked
                            ? [...setup.players, p]
                            : setup.players.filter(x => x !== p);
                        render.start();
                    },
                });
                const disc = on
                    ? el("span", { className: "disc rayed" }, el("span", { className: "check" }))
                    : el("span", { className: "disc", textContent: "+" });
                return el("label", { className: `player color-${p} ${on ? "on" : "off"}` },
                    input, disc, color.toUpperCase());
            }));

            const players = cfg.players.length;
            const rounds = players && cfg.cardCount / players;
            $("start-summary").textContent = players
                ? `${players} joueur${players > 1 ? "s" : ""} · ${rounds} tour${rounds > 1 ? "s" : ""}`
                : "";

            $("start-back").hidden = locked;
            $("btn-start").hidden = locked;
            $("btn-start").disabled = setup.players.length === 0;
            $("btn-resume").hidden = !locked;
            $("btn-abort").hidden = !locked;
        },

        game() {
            renderHeader();
            renderScores();
            renderCard();
            renderBoard();
        },

        scores() {
            const rows = S.ranking(game);
            const winners = rows.filter(r => r.rank === 0);
            const tie = winners.length > 1;
            $("scores-icon").replaceChildren(icon(game.theme));
            $("scores-title").textContent = `${themeLabel(game.theme)} · PARTIE TERMINÉE`;

            const box = $("winners");
            box.className = tie ? `tie tie-${winners.length}` : "";
            setColor(box, tie ? -1 : winners[0].player);
            box.replaceChildren(...winners.map(r =>
                el("div", { className: `big rayed color-${r.player}`, textContent: r.total })));
            $("winner").textContent = tie ? "ÉGALITÉ" : `${S.COLORS[winners[0].player].toUpperCase()} GAGNE`;
            setColor($("winner"), tie ? -1 : winners[0].player);

            $("score-table").tBodies[0].replaceChildren(...rows.map(r =>
                el("tr", { className: `color-${r.player}` },
                    el("td", { className: "rank", textContent: r.rank + 1 }),
                    el("td", { className: "who" },
                        el("span", { className: "med", textContent: r.total }),
                        el("span", { className: "name", textContent: S.COLORS[r.player].toUpperCase() })),
                    el("td", { textContent: r.perfect }),
                    el("td", { textContent: r.imperfect }))));
        },
    };

    function renderScores() {
        const sc = S.scores(game);
        const active = game.over ? null : S.currentPlayer(game);
        $("scores").replaceChildren(...game.players.map(p => {
            const s = sc[p];
            const state = p === active ? " current rayed" : s.played ? " played" : "";
            const medallion = el("div", { className: `score color-${p}${state}`, textContent: s.total + s.inRound });
            medallion.setAttribute("aria-label", `${S.COLORS[p]} : ${s.total + s.inRound}`);
            return medallion;
        }));
    }

    const setColor = (e, player) => {
        e.classList.remove("color-0", "color-1", "color-2", "color-3");
        if (player >= 0) e.classList.add(`color-${player}`);
    };

    // True minus; thousands separated by a no-break space from 5 digits (U+202F is not in Pathway).
    function formatYear(year) {
        const digits = String(Math.abs(year));
        const grouped = digits.length < 5 ? digits : digits.replace(/\B(?=(\d{3})+$)/g, "\u00a0");
        return (year < 0 ? "\u2212" : "") + grouped;
    }

    function setYear(e, year) {
        e.textContent = typeof year === "number" ? formatYear(year) : year;
        e.classList.toggle("long", String(year).length > 5);
        return e;
    }

    function outcomeLabel(c) {
        switch (S.outcome(c)) {
            case "perfect": return `PARFAIT · +${c.points}`;
            case "imperfect": return `PRESQUE · +${c.points} / ${c.max}`;
            default: return `RATÉ · 0 / ${c.max}`;
        }
    }

    function cardEl(player, label, text, year) {
        const card = el("div", { className: "card" },
            el("span", { className: "label pennant", textContent: label }),
            ...(year === undefined ? [] : [setYear(el("span", { className: "year" }), year)]),
            el("div", { className: "text", textContent: text }));
        card.classList.toggle("result", year !== undefined);
        setColor(card, player);
        return card;
    }

    const showInZone = card => $("card-zone").replaceChildren(...(card ? [card] : []));

    function renderCard() {
        const front = $("card-front");
        front.hidden = !(cardOpen || game.over);
        const last = game.last && game.board[game.last.index];
        if (last && (showResult || game.over)) showInZone(cardEl(last.player, outcomeLabel(last), last.text, last.year));
        else if (showResult) showInZone(null);
        else showInZone(cardEl(S.currentPlayer(game), "À PLACER", S.currentCard(game).text));

        const hint = text => el("p", { className: "hint pennant", textContent: text });
        setColor(front, game.over ? -1 : S.currentPlayer(game));
        front.replaceChildren(...(game.over
            ? [cardEl(-1, "PARTIE TERMINÉE", "Toutes les cartes ont été jouées."), hint("TOUCHEZ POUR LES SCORES")]
            : [cardEl(S.currentPlayer(game), "À PLACER", S.currentCard(game).text), hint("TOUCHEZ POUR PLACER")]));
        updateGuidance();
    }

    // Swipe first, then press: labels until the first scroll on a game's first turn, pulse after.
    function updateGuidance() {
        const docked = !cardOpen && !game.over;
        $("coach").hidden = !(docked && game.turn === 0 && !scrolled);
        clearTimeout(settleTimer);
        $("marker").classList.remove("pulse");
        if (docked && scrolled) {
            settleTimer = setTimeout(() => $("marker").classList.add("pulse"), SETTLE_MS);
        }
    }

    const spacer = () => el("div", { className: "spacer", textContent: "FAITES GLISSER" });

    function renderHeader() {
        const rounds = S.totalRounds(game);
        $("game-icon").replaceChildren(icon(game.theme));
        $("game-theme").textContent = themeLabel(game.theme);
        $("game-round").textContent = `Tour ${Math.min(game.round + 1, rounds)} / ${rounds}`;
        $("progress").replaceChildren(...Array.from({ length: rounds }, (_, i) =>
            el("span", { className: i < game.round ? "done" : "" })));
    }

    function boardRow(c, round) {
        const row = el("div", { className: "row" },
            setYear(el("span", { className: "year" }), c.year),
            el("span", { className: "text", textContent: c.text }));
        if (c.player >= 0 && c.round === round) {
            row.classList.add("this-round");
            setColor(row, c.player);
        }
        return row;
    }

    function renderBoard() {
        const board = $("board");
        const children = [spacer()];
        game.board.forEach(c => children.push(el("div", { className: "gap" }), boardRow(c, game.round)));
        children.push(el("div", { className: "gap" }), spacer());
        board.replaceChildren(...children);

        const marker = $("marker");
        marker.textContent = game.available;
        marker.disabled = game.over;
        setColor($("board-zone"), game.over ? -1 : S.currentPlayer(game));

        // Rest just above the card placed last, or in the middle of the board.
        restGap = game.last ? game.last.index : Math.floor(game.board.length / 2);
        scrolled = false;
        recentre();
        updateGuidance();
    }

    function recentre() {
        const board = $("board");
        board.scrollTop = board.querySelectorAll(".gap")[restGap].offsetTop - board.clientHeight / 2;
        restTop = board.scrollTop;
    }

    function selectedGap() {
        const zone = $("board").getBoundingClientRect();
        const center = zone.top + zone.height / 2;
        let best = 0;
        let bestDistance = Infinity;
        $("board").querySelectorAll(".gap").forEach((g, i) => {
            const d = Math.abs(g.getBoundingClientRect().top - center);
            if (d < bestDistance) {
                bestDistance = d;
                best = i;
            }
        });
        return best;
    }

    // FLIP: apply a DOM change, then animate each element from where it was to where it is now.
    function flip(elements, mutate, duration) {
        const tops = elements.map(e => e.getBoundingClientRect().top);
        mutate();
        elements.forEach((e, i) => {
            const dy = tops[i] - e.getBoundingClientRect().top;
            if (dy) e.animate([{ transform: `translateY(${dy}px)` }, { transform: "none" }], { duration, easing: "ease-in-out" });
        });
        return wait(duration);
    }

    function flyPoint(from, player, dx, dy, lost) {
        const r = from.getBoundingClientRect();
        const dot = el("span", { className: `chip flying color-${player}`, textContent: "1" });
        Object.assign(dot.style, { left: `${r.left + r.width / 2 - 14}px`, top: `${r.top + r.height / 2 - 14}px` });
        document.body.append(dot);
        const anim = dot.animate(
            [{ transform: "none", opacity: 1 }, { transform: `translate(${dx}px, ${dy}px)`, opacity: lost ? 0 : 1 }],
            { duration: 600, easing: "ease-in" });
        return anim.finished.then(() => dot.remove());
    }

    // Replays the placement: the card is inserted at the chosen gap and stays on the marker
    // while the other cards jump over it, one group of identical years at a time.
    async function animatePlacement(before, placed, gap, index, steps) {
        const board = $("board");
        $("screen-game").classList.add("busy");
        board.classList.add("animating");

        const rows = before.map(c => boardRow(c, placed.round));
        const marker = $("marker");
        marker.textContent = placed.max;
        setColor($("board-zone"), placed.player);
        const year = el("span", { className: "year" });
        const card = el("div", { className: `row this-round color-${placed.player}` },
            year, el("span", { className: "text", textContent: placed.text }));
        board.replaceChildren(spacer(), ...rows, spacer());
        showInZone(cardEl(placed.player, "À PLACER", placed.text));

        const lineY = () => board.getBoundingClientRect().top + board.clientHeight / 2;
        await Promise.all([
            flip(rows, () => {
                board.insertBefore(card, rows[gap] ?? board.lastChild);
                const r = card.getBoundingClientRect();
                board.scrollTop += r.top + r.height / 2 - lineY();
            }, HOP_MS),
            card.animate([{ transform: "translateX(-110%)" }, { transform: "none" }],
                { duration: HOP_MS, easing: "ease-out" }).finished,
        ]);

        const up = index < gap;
        const all = [...rows, card];
        const hop = (count, duration) => flip(all, () => {
            const top = card.getBoundingClientRect().top;
            let target = card;
            for (let k = 0; k < count; k++) target = up ? target.previousElementSibling : target.nextElementSibling;
            if (up) target.before(card);
            else target.after(card);
            board.scrollTop += card.getBoundingClientRect().top - top;
        }, duration);

        let points = placed.max;
        let i = 0;
        for (; i < steps.length && points > 0; i++) {
            if (steps[i].cost) {
                marker.textContent = --points;
                flyPoint(marker, placed.player, 40, 80, true);
            }
            await hop(steps[i].count, HOP_MS);
        }
        const rest = steps.slice(i).reduce((n, s) => n + s.count, 0);
        if (rest) await hop(rest, RUSH_MS);

        setYear(year, placed.year);
        showInZone(cardEl(placed.player, outcomeLabel(placed), placed.text, placed.year));
        await wait(400);

        const score = $("scores").children[game.players.indexOf(placed.player)].getBoundingClientRect();
        const from = marker.getBoundingClientRect();
        const flights = [];
        for (let k = 0; k < placed.points; k++) {
            marker.textContent = placed.points - k - 1;
            flights.push(flyPoint(marker, placed.player,
                score.left + score.width / 2 - from.left, score.top + score.height / 2 - from.top, false));
            await wait(POINT_STAGGER_MS);
        }
        await Promise.all(flights);
        await wait(300);

        board.classList.remove("animating");
        $("screen-game").classList.remove("busy");
    }

    $("start-back").onclick = () => show("themes");
    $("btn-start").onclick = () => {
        game = S.newGame(setup.theme, FACTS[setup.theme], setup.cardCount, setup.players);
        save();
        cardOpen = true;
        showResult = true;
        show("game");
    };
    $("btn-resume").onclick = () => {
        cardOpen = true;
        showResult = true;
        show("game");
    };
    $("btn-abort").onclick = () => {
        if (!confirm("Abandonner la partie en cours ?")) return;
        setup.theme = game.theme;
        game = null;
        save();
        show("start");
    };
    $("game-back").onclick = () => show("start");
    $("board").onscroll = () => {
        if ($("board").classList.contains("animating")) return;
        if (!scrolled && Math.abs($("board").scrollTop - restTop) < SCROLL_THRESHOLD_PX) return;
        scrolled = true;
        updateGuidance();
    };
    $("card-front").onclick = () => {
        if (game.over) {
            show("scores");
            return;
        }
        cardOpen = false;
        showResult = false;
        renderCard();
        // Docking resizes the board; keep it on the same gap so this doesn't count as a scroll.
        if (!scrolled) recentre();
    };
    $("card-zone").onclick = () => {
        // The result card sits above the veil: a tap on it counts as a tap on the card in front.
        if (cardOpen || game.over) {
            $("card-front").onclick();
            return;
        }
        cardOpen = true;
        renderCard();
    };
    $("marker").onclick = async () => {
        if (game.over) return;
        const gap = selectedGap();
        const before = game.board.slice();
        const { index, steps } = S.play(game, gap);
        const placed = game.board[index];
        S.next(game);
        save();
        scrolled = false;
        updateGuidance();
        await animatePlacement(before, placed, gap, index, steps);
        cardOpen = true;
        showResult = true;
        render.game();
    };
    $("btn-ok").onclick = () => {
        game = null;
        save();
        show("themes");
    };

    show(game ? (game.over ? "scores" : "start") : "themes");
})();
</script>
</body>
